<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Карта изображений</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Карта изображений</h1>

  <div style="position: relative; display: inline-block;">
    <img src="cat.jpg" usemap="#site-map" width="800" height="500">

    <svg width="800" height="500" style="position: absolute; top: 0; left: 0; pointer-events: none;">
      <rect x="50" y="50" width="150" height="100" stroke="red" fill="none" stroke-width="2"/>
      <circle cx="400" cy="100" r="60" stroke="blue" fill="none" stroke-width="2"/>
      <polygon points="600,80 640,120 600,160 560,120" stroke="green" fill="none" stroke-width="2"/>
      <polygon points="150,300 250,450 50,450" stroke="orange" fill="none" stroke-width="2"/>
      <rect x="300" y="350" width="200" height="50" stroke="purple" fill="none" stroke-width="2"/>
      <rect x="650" y="350" width="50" height="50" stroke="black" fill="none" stroke-width="2"/>
    </svg>

    <div id="videoContainer">
        <video id="myVideo" width="640" height="360" controls>
          <source src="cat_video.mp4" type="video/mp4">
          Ваш браузер не поддерживает видео.
        </video>
      </div>
  </div>

  <audio id="myAudio" src="smeshariki.mp3" preload="auto"></audio>

  <map name="site-map">
    <!-- 1. Прямоугольник -->
    <area shape="rect" coords="50,50,200,150" href="page1.html" alt="Страница 1" title="Перейти на страницу 1">

    <!-- 2. Круг -->
    <area shape="circle" coords="400,100,60" href="#" onclick="toggleMusic(); return false;" alt="Музыка" title="Проиграть музыку">

    <!-- 3. Ромб -->
    <area shape="poly" coords="600,80,640,120,600,160,560,120" href="#" onclick="showVideo(); return false;" alt="Видео" title="Показать видео">

    <!-- 4. Треугольник -->
    <area shape="poly" coords="150,300,250,450,50,450" href="#" onclick="changeBackground()" alt="Сменить фон" title="Сменить фон страницы">

    <!-- 5. Еще прямоугольник -->
    <area shape="rect" coords="300,350,500,400" href="#" onclick="alert('Хорошего дня и отличного настроения!'); return false;" alt="Овал" title="Показать сообщение">

    <!-- 6. Квадрат -->
    <area shape="rect" coords="650,350,700,400" href="#" onclick="startStarfall(); return false;" alt="Анимация" title="Запустить звездопад">
  </map>

  <script src="script.js"></script>

</body>
</html>
